spring.application.name=workshop


spring.datasource.url=jdbc:mysql://localhost:3306/workshophub
spring.datasource.username=${DB_USERNAME_MYSQL}
spring.datasource.password=${DB_PASSWORD_MYSQL}


spring.jpa.hibernate.ddl-auto=update


# Development-only seeded account. Override these environment variables before deployment.
app.seed.admin-name=${SEED_ADMIN_NAME:WorkshopHub Admin}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@workshophub.local}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:ChangeMe123!}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
